[project]
name = "afac-2026-challenge-track2"
version = "0.1.0"
description = "AFAC 2026 challenge track 2 document parsing and submission pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.7.14",
    "pillow>=11.0.0",
]

[project.scripts]
afac = "afac_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afac_pipeline"]
